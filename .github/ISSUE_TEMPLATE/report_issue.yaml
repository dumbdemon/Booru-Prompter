name: Bug Report
description: File a bug report.
title: "[Bug]: "
assignees: dumbdemon
type: bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us, what did you expect to happen?
      placeholder: Tell us what you see!
      value: "A bug happened!"
    validations:
      required: true
  - type: input
    id: comfy-version
    attributes:
      label: ComfyUI Version
      description: "Which version of ComfyUI are you running?"
      placeholder: "0.34.0"
    validations:
      required: true
  - type: input
    id: comfy-frontend-version
    attributes:
      label: ComfyUI Version
      description: "Which version of ComfyUI Frontend are you running?"
      placeholder: "v1.51.9"
    validations:
      required: true
  - type: dropdown
    id: version
    attributes:
      label: Version
      description: What version of our software are you running?
      options:
        - 1.0.0
      default: 0
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Please copy and paste any relevant log output. This will be automatically formatted into code, so no need for backticks.
      render: shell
  - type: checkboxes
    id: terms
    attributes:
      label: Not a Deplicate
      description: By submitting this issue, you agree that this issue is not a deuplicate.
      options:
        - label: I agree that I have checked and this is not a duplicate.
          required: true
  - type: upload
    id: workflow
    attributes:
      label: Upload workflow
      description: Upload the workflow JSON or image, if necessary.
    validations:
      required: false
